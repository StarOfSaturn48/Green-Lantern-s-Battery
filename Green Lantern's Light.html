<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Power Battery - Green Lantern</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevent accidental selection while preserving responsive layout and touch interaction */
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #010704;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Canvas for particles and cosmic space */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Global emerald flash overlay */
        #flashOverlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(57, 255, 20, 0.85) 0%, rgba(0, 255, 102, 0.45) 50%, rgba(0,0,0,0) 90%);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.15s ease-out;
        }

        /* Carbon-fiber mesh background */
        .carbon-background {
            background-color: #020a05;
            background-image: 
                radial-gradient(circle at center, rgba(0, 255, 102, 0.35) 0%, rgba(2, 15, 8, 0.95) 70%, #000502 100%),
                repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.4) 0, rgba(0, 0, 0, 0.4) 2px, transparent 0, transparent 4px);
        }

        /* White glowing emblem pulse animation */
        @keyframes emblemGlowPulse {
            0%, 100% {
                filter: drop-shadow(0 0 15px #ffffff) drop-shadow(0 0 30px rgba(0, 255, 102, 0.8)) drop-shadow(0 0 60px rgba(0, 255, 102, 0.5));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 25px #ffffff) drop-shadow(0 0 45px rgba(0, 255, 102, 0.95)) drop-shadow(0 0 90px rgba(57, 255, 20, 0.7));
                transform: scale(1.02);
            }
        }

        .emblem-idle {
            animation: emblemGlowPulse 3s infinite ease-in-out;
        }

        /* Charged state while the user holds the screen */
        .emblem-charged {
            filter: drop-shadow(0 0 35px #ffffff) drop-shadow(0 0 70px #00ff66) drop-shadow(0 0 120px #39ff14) drop-shadow(0 0 180px #00ffaa) !important;
            transform: scale(1.08) !important;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s ease-out;
        }

        /* Responsive sizing for short screens and mobile devices */
        #lanternContainer { width: min(78vw, 420px, 48vh); width: min(78vw, 420px, 48dvh); }
        #officialSvgLogo, #customImgLogo { width: 100%; height: auto; aspect-ratio: 1; }
        #coreBgGlow { width: 115%; height: auto; aspect-ratio: 1; }
        header { margin-top: max(1rem, env(safe-area-inset-top)); }
        footer { margin-bottom: max(1rem, env(safe-area-inset-bottom)); }
        #instructionText { max-width: min(90vw, 760px); overflow-wrap: anywhere; }
        @media (max-width: 640px) {
            header { padding-inline: 1rem; }
            header h1 { letter-spacing: 0.28em; font-size: clamp(0.8rem, 3.5vw, 1rem); }
            header p { font-size: 0.65rem; }
            #lanternContainer { width: min(76vw, 360px, 42dvh); }
            footer { width: 100%; box-sizing: border-box; gap: 0.65rem; padding-inline: 1rem; }
            #instructionText { font-size: clamp(0.68rem, 2.8vw, 0.9rem); line-height: 1.6; }
        }
        @media (max-height: 560px) and (orientation: landscape) {
            header { margin-top: 0.4rem; }
            #lanternContainer { width: min(40vw, 52dvh, 300px); }
            footer { margin-bottom: 0.4rem; gap: 0.35rem; }
            #instructionText { font-size: 0.7rem; line-height: 1.35; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center relative overflow-hidden select-none cursor-pointer carbon-background">

    <!-- Global emerald shockwave / flash overlay -->
    <div id="flashOverlay"></div>

    <!-- Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Header and title -->
    <header class="z-20 mt-6 text-center px-4 pointer-events-none flex flex-col items-center gap-1">
        <h1 class="text-base sm:text-lg md:text-xl uppercase tracking-[0.5em] text-emerald-300 font-black drop-shadow-[0_0_15px_#00ff66]">
            Power Battery
        </h1>
        <p class="text-[10px] sm:text-xs text-emerald-400/80 tracking-widest uppercase font-semibold">
            Sector 2814
        </p>
    </header>

    <!-- Centered Lantern emblem -->
    <main class="z-20 my-auto flex flex-col items-center justify-center relative pointer-events-none">
        
        <!-- Main Lantern housing -->
        <div id="lanternContainer" role="img" aria-label="Glowing Green Lantern emblem. Press and hold anywhere on the screen to charge." class="emblem-idle transition-all duration-300 relative flex items-center justify-center">
            
            <!-- Atmospheric back glow -->
            <div id="coreBgGlow" class="absolute w-72 h-72 sm:w-96 sm:h-96 bg-emerald-500/30 rounded-full blur-3xl -z-10 transition-all duration-300"></div>

            <!-- Recreated SVG emblem -->
            <svg id="officialSvgLogo" class="w-72 h-72 sm:w-80 sm:h-80 md:w-[420px] md:h-[420px] transition-all duration-300" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Intense white and green core glow -->
                    <radialGradient id="whiteCoreGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="60%" stop-color="#ccffdd" />
                        <stop offset="85%" stop-color="#00ff66" />
                        <stop offset="100%" stop-color="#006622" />
                    </radialGradient>
                    
                    <filter id="whiteGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <!-- Central radial background glow -->
                <circle cx="250" cy="250" r="220" fill="url(#whiteCoreGlow)" opacity="0.25"/>

                <!-- Emblem geometry -->
                <g filter="url(#whiteGlowFilter)">
                    <!-- Outer solid white ring -->
                    <circle cx="250" cy="250" r="210" stroke="#ffffff" stroke-width="28" fill="none"/>
                    
                    <!-- Inner white emblem shape -->
                    <!-- Top horizontal bar -->
                    <rect x="135" y="118" width="230" height="34" rx="4" fill="#ffffff"/>
                    
                    <!-- Bottom horizontal bar -->
                    <rect x="135" y="348" width="230" height="34" rx="4" fill="#ffffff"/>

                    <!-- Main ring and vertical pillars joining the bars -->
                    <path d="
                        M 135 152 
                        L 365 152 
                        L 365 185
                        A 115 115 0 0 1 365 315
                        L 365 348 
                        L 135 348 
                        L 135 315
                        A 115 115 0 0 1 135 185
                        Z
                        M 250 178
                        A 72 72 0 1 0 250 322
                        A 72 72 0 1 0 250 178
                        Z" 
                        fill="#ffffff" 
                        fill-rule="evenodd"/>
                </g>
            </svg>

            <!-- Optional custom image container -->
            <img id="customImgLogo" class="hidden w-72 h-72 sm:w-80 sm:h-80 md:w-[420px] md:h-[420px] object-contain rounded-full drop-shadow-[0_0_35px_#ffffff]" alt="Green Lantern Logo" />
        </div>
    </main>

    <!-- Footer instructions and oath -->
    <footer class="z-20 mb-6 flex flex-col items-center gap-3 pointer-events-auto max-w-xl text-center px-6">
        <p id="instructionText" class="text-xs sm:text-sm md:text-base text-emerald-300 tracking-wide uppercase font-extrabold leading-relaxed drop-shadow-[0_0_10px_#00ff66]">
            [ Press and hold to recharge ]
        </p>

        <!-- Toggle / Upload Logo Option -->
        <div class="flex items-center gap-2 bg-emerald-950/70 backdrop-blur-md border border-emerald-500/40 px-3 py-1.5 rounded-full text-xs text-emerald-300">
            <button id="logoToggleBtn" type="button" aria-label="Switch between the SVG emblem and custom image" onclick="toggleLogoMode()" class="hover:text-white transition-colors font-semibold">
              Switch logo
            </button>
            <span class="text-emerald-600">|</span>
            <label for="imageUploader" class="cursor-pointer hover:text-white transition-colors underline font-medium">
                Upload image
            </label>
            <input type="file" id="imageUploader" aria-label="Upload a custom Lantern emblem image" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
        </div>
    </footer>

    <!-- MAIN SCRIPT -->
    <script>
        // State variables
        let isCharging = false;
        let touchPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let isCustomImageMode = false;

        const GREEN_LANTERN_OATH = "In brightest day, in blackest night, No evil shall escape my sight. Let those who worship evil's might, Beware my power... Green Lantern's light!";

        // --- 1. CANVAS AND PARTICLE SYSTEM ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        });

        // Background starfield
        let stars = [];
        function initStars() {
            stars = [];
            const numStars = Math.floor((width * height) / 2800);
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.6,
                    alpha: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }
        initStars();

        // Particles and shockwaves
        let particles = [];
        let shockwaves = [];

        function spawnContinuousParticles() {
            if (!isCharging) return;

            const rect = lanternContainer.getBoundingClientRect();
            const targetX = rect.left + rect.width / 2;
            const targetY = rect.top + rect.height / 2;

            for (let i = 0; i < 5; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 280 + 130;
                
                const useTouchOrigin = Math.random() < 0.35;
                const startX = useTouchOrigin ? touchPos.x + (Math.random() - 0.5) * 70 : targetX + Math.cos(angle) * distance;
                const startY = useTouchOrigin ? touchPos.y + (Math.random() - 0.5) * 70 : targetY + Math.sin(angle) * distance;

                particles.push({
                    x: startX,
                    y: startY,
                    targetX: targetX,
                    targetY: targetY,
                    speed: Math.random() * 0.05 + 0.035,
                    progress: 0,
                    size: Math.random() * 4.5 + 1.5,
                    color: Math.random() > 0.25 ? '#00ff66' : (Math.random() > 0.5 ? '#39ff14' : '#ffffff')
                });
            }
        }

        function triggerReleaseShockwave() {
            const rect = lanternContainer.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            // Expanding energy shockwave ring
            shockwaves.push({
                x: cx,
                y: cy,
                radius: 30,
                maxRadius: Math.max(width, height) * 0.65,
                alpha: 0.95,
                color: '#00ff66'
            });

            // Energy spark explosion
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 9 + 3;
                particles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: Math.random() * 0.04 + 0.02,
                    size: Math.random() * 3.5 + 1.5,
                    color: Math.random() > 0.3 ? '#39ff14' : '#ffffff',
                    isExplosion: true
                });
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            // Draw stars
            for (let star of stars) {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) star.speed = -star.speed;
                ctx.fillStyle = `rgba(180, 255, 210, ${Math.max(0, star.alpha)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Generate stream particles
            if (isCharging) {
                spawnContinuousParticles();
            }

            // Animate shockwave rings
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                let sw = shockwaves[i];
                sw.radius += (sw.maxRadius - sw.radius) * 0.12;
                sw.alpha -= 0.03;

                if (sw.alpha <= 0) {
                    shockwaves.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.strokeStyle = sw.color;
                ctx.globalAlpha = sw.alpha;
                ctx.lineWidth = 7;
                ctx.shadowBlur = 25;
                ctx.shadowColor = sw.color;
                ctx.stroke();
                ctx.restore();
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];

                if (p.isExplosion) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;

                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = p.color;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    p.progress += p.speed;
                    p.x += (p.targetX - p.x) * p.speed;
                    p.y += (p.targetY - p.y) * p.speed;

                    const dist = Math.hypot(p.targetX - p.x, p.targetY - p.y);

                    if (dist < 18 || p.progress >= 1) {
                        particles.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = Math.min(1, p.progress * 2);
                    ctx.shadowBlur = 14;
                    ctx.shadowColor = p.color;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();


        // --- 2. AUDIO ENGINE (Web Audio API: plasma wind and release burst) ---
        let audioCtx = null;
        let noiseNode = null;
        let noiseFilter = null;
        let noiseGain = null;
        let humOsc = null;
        let humGain = null;
        let masterChargeGain = null;
        let chargeStartTime = 0;
        let chargeRampInterval = null;

        function initAudioEngine() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Pink noise generator for plasma wind
        function createPinkNoiseBuffer(ctx, duration = 3) {
            const bufferSize = ctx.sampleRate * duration;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);

            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                data[i] *= 0.11;
                b6 = white * 0.115926;
            }
            return buffer;
        }

        // Start charging audio (atmospheric plasma wind and hum)
        function startChargeSound() {
            initAudioEngine();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            masterChargeGain = audioCtx.createGain();
            masterChargeGain.gain.setValueAtTime(0.001, now);
            masterChargeGain.gain.linearRampToValueAtTime(0.35, now + 0.3);

            // 1. Plasma wind layer (filtered pink noise)
            const noiseBuffer = createPinkNoiseBuffer(audioCtx);
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = noiseBuffer;
            noiseNode.loop = true;

            noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(250, now);
            noiseFilter.Q.setValueAtTime(1.2, now);

            noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.4, now);

            noiseNode.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(masterChargeGain);

            // 2. Warm sub-bass hum layer
            humOsc = audioCtx.createOscillator();
            humOsc.type = 'sine';
            humOsc.frequency.setValueAtTime(95, now);

            humGain = audioCtx.createGain();
            humGain.gain.setValueAtTime(0.25, now);

            const humMod = audioCtx.createOscillator();
            const humModGain = audioCtx.createGain();
            humMod.frequency.setValueAtTime(3.5, now);
            humModGain.gain.setValueAtTime(4, now);

            humMod.connect(humOsc.frequency);
            humOsc.connect(humGain);
            humGain.connect(masterChargeGain);

            masterChargeGain.connect(audioCtx.destination);

            noiseNode.start(now);
            humOsc.start(now);
            humMod.start(now);

            chargeStartTime = now;
            clearInterval(chargeRampInterval);
            chargeRampInterval = setInterval(() => {
                if (!isCharging || !audioCtx) return;
                const elapsed = audioCtx.currentTime - chargeStartTime;

                const filterFreq = Math.min(850, 250 + elapsed * 120);
                const humFreq = Math.min(180, 95 + elapsed * 18);

                noiseFilter.frequency.setTargetAtTime(filterFreq, audioCtx.currentTime, 0.1);
                humOsc.frequency.setTargetAtTime(humFreq, audioCtx.currentTime, 0.1);
            }, 60);
        }

        // Release audio (depressurization burst and echo)
        function playReleasePshhhSound() {
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            // White-noise burst
            const bufferSize = audioCtx.sampleRate * 0.45;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const pshhhNode = audioCtx.createBufferSource();
            pshhhNode.buffer = noiseBuffer;

            const pshhhFilter = audioCtx.createBiquadFilter();
            pshhhFilter.type = 'bandpass';
            pshhhFilter.frequency.setValueAtTime(3200, now);
            pshhhFilter.frequency.exponentialRampToValueAtTime(400, now + 0.35);
            pshhhFilter.Q.setValueAtTime(2.5, now);

            const pshhhGain = audioCtx.createGain();
            pshhhGain.gain.setValueAtTime(0.001, now);
            pshhhGain.gain.linearRampToValueAtTime(0.5, now + 0.02);
            pshhhGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

            // Echo / delay tail
            const delay = audioCtx.createDelay();
            delay.delayTime.setValueAtTime(0.08, now);
            const delayGain = audioCtx.createGain();
            delayGain.gain.setValueAtTime(0.2, now);

            pshhhNode.connect(pshhhFilter);
            pshhhFilter.connect(pshhhGain);

            pshhhGain.connect(audioCtx.destination);
            pshhhGain.connect(delay);
            delay.connect(delayGain);
            delayGain.connect(audioCtx.destination);

            pshhhNode.start(now);
            pshhhNode.stop(now + 0.45);
        }

        function stopChargeSound() {
            clearInterval(chargeRampInterval);

            if (masterChargeGain && audioCtx) {
                const now = audioCtx.currentTime;
                masterChargeGain.gain.cancelScheduledValues(now);
                masterChargeGain.gain.setValueAtTime(masterChargeGain.gain.value, now);
                masterChargeGain.gain.linearRampToValueAtTime(0.0001, now + 0.05);

                setTimeout(() => {
                    try {
                        if (noiseNode) noiseNode.stop();
                        if (humOsc) humOsc.stop();
                    } catch (e) {}
                }, 60);
            }

            playReleasePshhhSound();
        }


        // --- 3. LOGO TOGGLE AND CUSTOM IMAGE UPLOAD ---
        const officialSvgLogo = document.getElementById('officialSvgLogo');
        const customImgLogo = document.getElementById('customImgLogo');
        const logoToggleBtn = document.getElementById('logoToggleBtn');

        function toggleLogoMode() {
            isCustomImageMode = !isCustomImageMode;
            if (isCustomImageMode) {
                if (!customImgLogo.src || customImgLogo.src === window.location.href) {
                    // Default high-resolution online logo if no local image has been uploaded
                    customImgLogo.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Green_Lantern_logo.svg/1024px-Green_Lantern_logo.svg.png';
                }
                officialSvgLogo.classList.add('hidden');
                customImgLogo.classList.remove('hidden');
                logoToggleBtn.textContent = 'Use SVG logo';
            } else {
                officialSvgLogo.classList.remove('hidden');
                customImgLogo.classList.add('hidden');
                logoToggleBtn.textContent = 'Use custom image';
            }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    customImgLogo.src = evt.target.result;
                    isCustomImageMode = false; // The toggle will switch to image mode
                    toggleLogoMode();
                };
                reader.readAsDataURL(file);
            }
        }


        // --- 4. INTERACTION EVENT HANDLERS ---
        const lanternContainer = document.getElementById('lanternContainer');
        const flashOverlay = document.getElementById('flashOverlay');
        const coreBgGlow = document.getElementById('coreBgGlow');
        const instructionText = document.getElementById('instructionText');

        function startCharging(e) {
            // Ignore presses on the footer controls
            if (e.target && (e.target.closest('footer') || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL' || e.target.tagName === 'INPUT')) {
                return;
            }

            if (isCharging) return;
            isCharging = true;

            updateTouchPos(e);

            // Visual feedback
            flashOverlay.style.opacity = '1';
            coreBgGlow.classList.add('scale-150', 'bg-emerald-400/60');
            lanternContainer.classList.remove('emblem-idle');
            lanternContainer.classList.add('emblem-charged');
            
            // Display the Green Lantern oath
            instructionText.textContent = GREEN_LANTERN_OATH;
            instructionText.className = "text-xs sm:text-sm md:text-base text-white tracking-widest font-black leading-relaxed drop-shadow-[0_0_18px_#00ff66] animate-pulse";

            startChargeSound();
        }

        function stopCharging() {
            if (!isCharging) return;
            isCharging = false;

            flashOverlay.style.opacity = '0';
            coreBgGlow.classList.remove('scale-150', 'bg-emerald-400/60');
            lanternContainer.classList.remove('emblem-charged');
            lanternContainer.classList.add('emblem-idle');

            instructionText.textContent = "[ Press and hold to recharge ]";
            instructionText.className = "text-xs sm:text-sm md:text-base text-emerald-300 tracking-wide uppercase font-extrabold leading-relaxed drop-shadow-[0_0_10px_#00ff66]";

            triggerReleaseShockwave();
            stopChargeSound();
        }

        function updateTouchPos(e) {
            if (e.touches && e.touches.length > 0) {
                touchPos.x = e.touches[0].clientX;
                touchPos.y = e.touches[0].clientY;
            } else if (e.clientX !== undefined) {
                touchPos.x = e.clientX;
                touchPos.y = e.clientY;
            }
        }

        // Mouse and touch listeners
        window.addEventListener('mousedown', (e) => startCharging(e));
        window.addEventListener('mouseup', () => stopCharging());
        window.addEventListener('mouseleave', () => stopCharging());
        window.addEventListener('mousemove', (e) => { if (isCharging) updateTouchPos(e); });

        window.addEventListener('touchstart', (e) => startCharging(e), { passive: true });
        window.addEventListener('touchend', () => stopCharging());
        window.addEventListener('touchcancel', () => stopCharging());
        window.addEventListener('touchmove', (e) => { if (isCharging) updateTouchPos(e); }, { passive: true });

    </script>
</body>
</html>
